<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kristal Bubble Bar — Catálogo (SSR)</title>
  <style>
    /* Estilos mínimos con la paleta de Kristal Bubble Bar */
    body { font-family: system-ui, sans-serif; background: #faf5ff; color: #2a1740; margin: 0; }
    header { background: #6ee7b7; padding: 1.25rem 1rem; text-align: center; border-bottom: 5px solid #f9a8d4; }
    h1 { margin: 0; color: #4c1d95; font-size: 1.6rem; }
    main { max-width: 720px; margin: 1.5rem auto; padding: 0 1rem; }
    .aviso { color: #5b4a70; font-size: .95rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 1rem; background: #fff; border: 1px solid #e9d5ff; border-radius: 10px; padding: .75rem 1rem; margin-bottom: .5rem; }
    .precio { font-weight: bold; color: #7e22ce; white-space: nowrap; }
    small { color: #5b4a70; }
  </style>
</head>
<body>
  <header>
    <h1>Kristal Bubble Bar</h1>
  </header>

  <main>
    <!-- <p class="aviso">Catálogo renderizado en el servidor (SSR): este HTML ya viene con los productos escritos. Presiona Ctrl+U para comprobarlo.</p> -->

    <ul>
      <!-- El bucle recorre la lista de productos que la vista mandó en el contexto -->
      {% for producto in productos %}
        <li>
          <span><strong>{{ producto.nombre }}</strong> <small>(stock: {{ producto.stock }})</small></span>
          <span class="precio">${{ producto.precio }}</span>
        </li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
