<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kristal Bubble Bar — Catálogo (SSR)</title>
  <style>
    /* Estilos mínimos con la paleta de Kristal Bubble Bar */
    body { font-family: system-ui, sans-serif; background: #faf5ff; color: #A855F7; margin: 0; }
    header { background: #6ee7b7; padding: 1.25rem 1rem; text-align: center; border-bottom: 5px solid #f9a8d4; }
    h1 { margin: 0; color: #A855F7; font-size: 1.6rem; }
    main { max-width: 720px; margin: 1.5rem auto; padding: 0 1rem; }

    ul.grid { margin: 0; padding: 0; list-style: none; }

    /* Las tres columnas: se comparten entre encabezado y filas */
    .encabezado,
    li {
      display: grid;
      grid-template-columns: 1fr 120px 90px; /* producto | categoría | precio */
      gap: 1rem;
      align-items: center;
    }

    .encabezado {
      padding: 0 1rem .5rem;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #7e22ce;
    }
    .encabezado span:nth-child(2) { text-align: center; }
    .encabezado span:nth-child(3) { text-align: right; }

    li { background: #fff; border: 1px solid #e9d5ff; border-radius: 10px; padding: .75rem 1rem; margin-bottom: .5rem; }
    li strong { font-size: 1rem; }

    .categoria { text-align: center; background: #6EE7B7; color: #A855F7; border-radius: 999px; padding: .1rem .6rem; font-size: .8rem; font-weight: 500; }
    .precio { text-align: right; font-weight: bold; color: #A855F7; white-space: nowrap; }
    small { color: #A855F7; font-weight: normal; }

    /* Celular: columnas más angostas para que el nombre no se apriete */
    @media (max-width: 480px) {
      .encabezado,
      li { grid-template-columns: 1fr 100px 75px; gap: .5rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Kristal Bubble Bar</h1>
  </header>

  <main>
    <div class="encabezado">
      <span>Producto</span>
      <span>Categoría</span>
      <span>Precio</span>
    </div>

    <ul class="grid">
      {% for producto in productos %}
        <li>
          <span><strong>{{ producto.nombre }}</strong> <small>(stock: {{ producto.stock }})</small></span>
          <span class="categoria">{{ producto.categoria }}</span>
          <span class="precio">${{ producto.precio }}</span>
        </li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
